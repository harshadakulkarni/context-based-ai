# Active by default (see application.yml). Every value here has a working
# fallback so a fresh checkout runs with zero env vars set, except the
# OpenAI key — without it, /api/define returns a clear "server_misconfigured" error.
#
# Uses an in-memory H2 database — no local DB server/install required, but
# data (including signed-up users) is wiped every time the app restarts.
# Set SPRING_PROFILES_ACTIVE=prod and the DB_* vars (see README) to point at
# a real Postgres instance instead.
server:
  port: ${PORT:8765}

spring:
  datasource:
    url: jdbc:h2:mem:contextdefine;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true # visit /h2-console while the app is running to inspect data

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-do-not-use-in-prod-change-this}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,chrome-extension://*}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  razorpay:
    # Empty by default so a fresh checkout still boots — /api/billing/*
    # endpoints return a clear "server_misconfigured" error until these are set.
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    plan-id: ${RAZORPAY_PLAN_ID:}
  google:
    # Empty by default so a fresh checkout still boots — /api/auth/google
    # returns a clear "server_misconfigured" error until this is set.
    client-id: ${GOOGLE_CLIENT_ID:}
