# No fallback defaults for anything secret or environment-specific — if one
# of these env vars is missing, Spring Boot fails to start rather than
# silently running with the local profile's dev secret/CORS origin.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  frontend-url: ${FRONTEND_URL}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    plan-id: ${RAZORPAY_PLAN_ID}
  google:
    # Optional even in prod, unlike the vars above — this is a live site
    # already, and a required-with-no-fallback var here would crash the
    # whole backend on the next deploy if it isn't set yet (same failure
    # mode Razorpay hit while it was still being configured). Missing just
    # makes /api/auth/google return a clear "server_misconfigured" error.
    client-id: ${GOOGLE_CLIENT_ID:}
