<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SensusGrow</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      width: 260px;
      padding: 16px;
      color: #1f2937;
      margin: 0;
    }
    h1 {
      font-size: 14.5px;
      margin: 0 0 6px;
    }
    p {
      font-size: 12.5px;
      color: #6b7280;
      line-height: 1.5;
      margin: 0 0 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px 9px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 10px;
      font-family: inherit;
      background: #fff;
      color: #1f2937;
    }
    button {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      font-weight: 600;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      background: #4f46e5;
    }
    button.secondary {
      background: transparent;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }
    .error {
      color: #b91c1c;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .status {
      font-size: 12px;
      color: #16a34a;
      margin-bottom: 12px;
    }
    .hidden {
      display: none;
    }
    a {
      color: #6366f1;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>SensusGrow</h1>

  <div id="logged-out-view">
    <p>Log in to start looking up words in context on any page.</p>
    <div id="login-error" class="error hidden"></div>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" />
    <button id="login-btn">Log in</button>
    <a href="#" id="signup-link">Don't have an account? Sign up</a>
  </div>

  <div id="logged-in-view" class="hidden">
    <div class="status" id="logged-in-email"></div>
    <p>Double or triple click any word on a page to see its meaning in context.</p>

    <label for="language">Definition language</label>
    <select id="language">
      <option value="English">English</option>
      <option value="Spanish">Spanish</option>
      <option value="French">French</option>
      <option value="German">German</option>
      <option value="Hindi">Hindi</option>
      <option value="Chinese (Simplified)">Chinese (Simplified)</option>
      <option value="Japanese">Japanese</option>
      <option value="Korean">Korean</option>
      <option value="Portuguese">Portuguese</option>
      <option value="Russian">Russian</option>
      <option value="Arabic">Arabic</option>
      <option value="Italian">Italian</option>
    </select>

    <button id="dashboard-btn" class="secondary">Open dashboard</button>
    <button id="logout-btn" class="secondary">Log out</button>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
