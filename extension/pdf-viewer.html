<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SensusGrow — PDF Viewer</title>
  <link rel="stylesheet" href="content.css" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #525659;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      background: #1f2937;
      color: #fff;
    }

    .toolbar strong {
      font-size: 13.5px;
    }

    .toolbar input[type="file"] {
      color: #e5e7eb;
      font-size: 12.5px;
    }

    .toolbar .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-left: auto;
    }

    #pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 24px;
    }

    .page-wrap {
      position: relative;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
      background: #fff;
    }

    .page-wrap canvas {
      display: block;
    }

    .empty-state {
      color: #d1d5db;
      text-align: center;
      padding: 80px 20px;
      font-size: 14px;
    }

    .load-error {
      color: #fca5a5;
      text-align: center;
      padding: 40px 20px;
      font-size: 13.5px;
    }

    /* Minimal pdf.js text-layer contract — positions/hides the selectable
       text pdf.js lays out over the canvas. Span transforms/font-size are
       set inline by TextLayer itself; this just establishes the overlay. */
    .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      line-height: 1;
      text-align: initial;
      transform-origin: 0 0;
      z-index: 2;
    }

    .textLayer span,
    .textLayer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .textLayer ::selection {
      background: rgba(108, 180, 48, 0.35);
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>SensusGrow — PDF Viewer</strong>
    <input type="file" id="file-input" accept="application/pdf" />
    <span class="hint">Double or triple click any word to define it, same as on the web.</span>
  </div>

  <div id="pages">
    <div class="empty-state" id="empty-state">Choose a PDF file above to get started.</div>
  </div>

  <script src="content.js"></script>
  <script type="module" src="pdf-viewer.js"></script>
</body>
</html>
