databases:
  - name: context-define-db
    databaseName: contextdefine
    user: contextdefine
    plan: free

services:
  - type: web
    name: context-define-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: context-define-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: context-define-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: context-define-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: context-define-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: context-define-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false # set manually in the Render dashboard — do not commit this value
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FREE_LIMIT
        value: "20"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to "https://<frontend>.onrender.com,chrome-extension://<your-extension-id>" once both exist
      - key: FRONTEND_URL
        sync: false # set to the frontend service's URL, e.g. https://context-define-frontend.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID
        sync: false

  - type: web
    name: context-define-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to the backend service's URL, e.g. https://context-define-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
